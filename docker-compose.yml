version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading_channel_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot_data.json:/app/bot_data.json
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Riyadh
    # للتشغيل المستمر
    command: python main.py

